spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lifebuddy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lifebuddy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lifebuddy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true