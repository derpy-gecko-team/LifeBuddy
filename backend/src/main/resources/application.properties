spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lifebuddy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lifebuddy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lifebuddy}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Set JWT_SECRET to a Base64-encoded random key of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}