name: lifebuddy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/guildhall/
    - assets/images/bazaar/
    - assets/images/buddy/

  fonts:
    - family: MySoul
      fonts: 
      - asset: assets/fonts/MySoul-Regular.ttf
        weight: 400
    - family: NorthEternal
      fonts: 
      - asset: assets/fonts/NorthEternal-yYl4V.otf
